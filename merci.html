<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✅ Merci! - Questionnaire Luminixe</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #3d7a3a 0%, #2d5a2a 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .content {
            padding: 40px;
        }

        .success-message {
            background: #d4edda;
            border: 2px solid #28a745;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: center;
            color: #155724;
        }

        .success-message strong {
            font-size: 18px;
            display: block;
            margin-bottom: 8px;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            flex: 1;
            min-width: 200px;
        }

        .btn-primary {
            background: #3d7a3a;
            color: white;
        }

        .btn-primary:hover {
            background: #2d5a2a;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(61, 122, 58, 0.3);
        }

        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            background: #e3f2fd;
            border-radius: 6px;
            color: #1565c0;
            margin-top: 20px;
        }

        .loading.active {
            display: block;
        }

        .success-notification {
            display: none;
            background: #d4edda;
            border: 1px solid #28a745;
            color: #155724;
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
        }

        .success-notification.active {
            display: block;
        }

        .error-notification {
            display: none;
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
        }

        .error-notification.active {
            display: block;
        }

        #pdfContent {
            display: none;
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }
            .container {
                box-shadow: none;
                border-radius: 0;
            }
            .button-group {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✅ Merci!</h1>
            <p>Vos réponses ont été enregistrées avec succès</p>
        </div>

        <div class="content">
            <div class="success-message">
                <strong>🎉 À bientôt pour un échange !</strong>
            </div>

            <div id="responsesContainer"></div>

            <div class="button-group">
                <button id="sendBtn" class="btn btn-primary" onclick="sendToLuminixe()">
                    📨 Envoyer mes réponses à Luminixe
                </button>
                <button class="btn btn-secondary" onclick="goBack()">
                    ← Retour accueil
                </button>
            </div>

            <div id="loadingIndicator" class="loading">
                ⏳ Envoi de vos réponses en cours...
            </div>

            <div id="successNotification" class="success-notification">
                ✅ Merci! Vos réponses ont bien été envoyées à Luminixe. Une copie des réponses sera envoyée à votre mail.
            </div>

            <div id="errorNotification" class="error-notification">
                ❌ Une erreur s'est produite. Veuillez réessayer.
            </div>
        </div>
    </div>

  

    <script>
        emailjs.init('F8-L4l7KrpktL2Fwc');

        const EMAILJS_CONFIG = {
            SERVICE_ID: 'service_qmmstqq',
            TEMPLATE_ID: 'template_03u4ouy',
            RECIPIENT_EMAIL: 'luminixe.web@gmail.com'
        };

        async function sendToLuminixe() {
    const loading = document.getElementById('loadingIndicator');
    const success = document.getElementById('successNotification');
    const error = document.getElementById('errorNotification');
    const btn = document.getElementById('sendBtn');

    loading.classList.add('active');
    success.classList.remove('active');
    error.classList.remove('active');
    btn.disabled = true;

    try {
        const saved = localStorage.getItem('questionnaire_data');
        const data = saved ? JSON.parse(saved) : {};

        const clientEmail = data.email || data.adresse_email || '';
        
        if (!clientEmail) {
            throw new Error('Email manquant.');
        }
        
// Récupérer les données du localStorage
const base64 = localStorage.getItem('charte_graphique_base64');
const filename = localStorage.getItem('charte_graphique_filename');
const type = localStorage.getItem('charte_graphique_type');      

// 1️⃣ Envoie au webhook Make
const makeResponse = await fetch('https://hook.eu1.make.com/5h0dp8cihk8d2lyr8nybgilscsdtvz6i', {
    method: 'POST',
    headers: {
        'Content-Type': 'application/json',
    },
    body: JSON.stringify({
        responses: data,
        charte_graphique: {
            filename: filename,
            data: base64,
            type: type
        },
        client_folder_name: `${data.prenom || 'Client'} ${data.nom || 'Inconnu'} ${data.entreprise || ''} ${data.metier || ''}`.trim(),
        client_email: clientEmail,
        timestamp: new Date().toISOString()
    })
});

const makeResponse = await fetch('https://hook.eu1.make.com/5h0dp8cihk8d2lyr8nybgilscsdtvz6i', {
    method: 'POST',
    headers: {
        'Content-Type': 'application/json',
    },
    body: JSON.stringify(bodyData)
});

        
        if (!makeResponse.ok) {
            throw new Error('Erreur lors de l\'envoi à Make');
        }

        // 2️⃣ Notification EmailJS pour toi
        await emailjs.send(
            EMAILJS_CONFIG.SERVICE_ID,
            EMAILJS_CONFIG.TEMPLATE_ID,
            {
                to_email: EMAILJS_CONFIG.RECIPIENT_EMAIL,
                from_name: data.prenom || 'Client',
                subject: `📋 ${data.prenom || ''} ${data.nom || ''} - ${data.entreprise || 'Entreprise'} (${data.metier || 'Métier'})`
            }
        );

        localStorage.removeItem('questionnaire_data');

        loading.classList.remove('active');
        success.classList.add('active');
    } catch (err) {
        console.error('❌ Erreur:', err);
        loading.classList.remove('active');
        error.classList.add('active');
        error.textContent = '❌ ' + err.message;
    } finally {
        btn.disabled = false;
    }
}

function goBack() {
    window.location.href = 'index.html';
}
    </script>

    <script>
    // Nettoyer complètement après que tout soit traité
    setTimeout(() => {
        localStorage.removeItem('questionnaire_data');
        localStorage.removeItem('charte_graphique_base64');
        localStorage.removeItem('charte_graphique_filename');
        localStorage.removeItem('charte_graphique_type');
    }, 5000); // Attendre 5 secondes pour que Make traite tout
</script>
</body>
</html>
